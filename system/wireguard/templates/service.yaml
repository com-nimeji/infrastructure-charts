# UDP traffic
apiVersion: v1
kind: Service
metadata:
  name: wg-easy-wg
  namespace: {{ .Release.Namespace }}
spec:
  ports:
    - name: wg
      port: {{ .Values.wg.nodePort }}
      nodePort: {{ .Values.wg.nodePort }}
      protocol: UDP
      targetPort: wg
  selector:
    app.kubernetes.io/name: wg-easy
  type: NodePort
---
# UI
apiVersion: v1
kind: Service
metadata:
  name: wg-easy-http
  namespace: {{ .Release.Namespace }}
spec:
  ports:
    - name: http
      port: 51821
      protocol: TCP
      targetPort: http
  selector:
    app.kubernetes.io/name: wg-easy
  type: ClusterIP
